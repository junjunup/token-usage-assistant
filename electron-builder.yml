appId: local.commandcode.tokenusageassistant
productName: Token 用量助手
executableName: TokenUsageAssistant
directories:
  output: release-v${version} # version comes from package.json
files:
  - desktop/**/*
  - dist/client/**/*
  - package.json
  - '!desktop/**/*.test.cjs'
  - '!desktop/island-poc/**' # T7.1 POC: development only
  - '!desktop/menubar-poc/**' # T7.3 POC: development only
asar: true
npmRebuild: false
# T8.7: the app's MIT license and the third-party notices / full license texts, next to app.asar on both platforms.
extraResources:
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
win:
  icon: desktop/assets/app.ico
  signExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Token 用量助手
  artifactName: TokenUsageAssistant-Setup-${version}.${ext}
portable:
  artifactName: TokenUsageAssistant-Portable-${version}.${ext}

mac:
  icon: desktop/assets/app.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: '13.0'
  executableName: 'Token 用量助手'
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  artifactName: TokenUsageAssistant-Mac-arm64-${version}.${ext}
  identity: '-'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Electron's own license and the bundled Chromium / Node.js licenses (electron-builder adds these on Windows only).
  extraResources:
    - from: node_modules/electron/dist/LICENSE
      to: LICENSE.electron.txt
    - from: node_modules/electron/dist/LICENSES.chromium.html
      to: LICENSES.chromium.html
  notarize: false
