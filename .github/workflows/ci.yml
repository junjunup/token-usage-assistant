name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Check files out byte-for-byte as committed (LF), so format:check matches on Windows too.
      - name: Disable line-ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      # Warnings do not fail the build; errors do (eslint exits non-zero only on errors).
      - name: Lint
        run: pnpm run lint
      # T5.5: strict JSDoc type check of the pure domain modules (tsconfig.json).
      - name: Type check
        run: pnpm run typecheck

      # T8.10: the pinned Harness runtimes (integrations/deepseek-harness/README.md), installed outside the
      # project with --ignore-scripts, so the three runtime tests run instead of being skipped. No model calls.
      - name: Install pinned Harness test runtimes (0.1.7-rc.1 and 0.2.1-rc.2)
        run: |
          npm install --prefix "$RUNNER_TEMP/harness-runtime" --ignore-scripts --no-audit --no-fund --save-exact \
            @deepseek-ai/dsh-session@0.1.7-rc.1 @deepseek-ai/cordis@4.0.4
          npm install --prefix "$RUNNER_TEMP/harness-cli" --ignore-scripts --no-audit --no-fund --save-exact \
            @deepseek-ai/dsh@0.1.7-rc.1
          echo "TUA_HARNESS_CONTRACT_RUNTIME=$RUNNER_TEMP/harness-runtime" >> "$GITHUB_ENV"
          echo "TUA_HARNESS_CLI_RUNTIME=$RUNNER_TEMP/harness-cli" >> "$GITHUB_ENV"
          # T8.13: the second verified runtime; its three runtime tests run with these two variables.
          npm install --prefix "$RUNNER_TEMP/harness-runtime-0.2" --ignore-scripts --no-audit --no-fund --save-exact \
            @deepseek-ai/dsh-session@0.2.1-rc.2 @deepseek-ai/cordis@4.0.5
          npm install --prefix "$RUNNER_TEMP/harness-cli-0.2" --ignore-scripts --no-audit --no-fund --save-exact \
            @deepseek-ai/dsh@0.2.1-rc.2
          echo "TUA_HARNESS_CONTRACT_RUNTIME_0_2=$RUNNER_TEMP/harness-runtime-0.2" >> "$GITHUB_ENV"
          echo "TUA_HARNESS_CLI_RUNTIME_0_2=$RUNNER_TEMP/harness-cli-0.2" >> "$GITHUB_ENV"

      - name: Test
        run: |
          set -o pipefail
          pnpm run test:desktop 2>&1 | tee test-output.txt

      - name: Test summary
        if: always()
        run: |
          [ -f test-output.txt ] || exit 0
          count() { grep -E "^ℹ $1 [0-9]+" test-output.txt | tail -1 | awk '{print $3}'; }
          {
            echo "### Tests (${{ matrix.os }})"
            echo ""
            echo "| total | pass | fail | skipped |"
            echo "|---|---|---|---|"
            echo "| $(count tests) | $(count pass) | $(count fail) | $(count skipped) |"
            skipped=$(grep -E '# SKIP' test-output.txt || true)
            if [ -n "$skipped" ]; then
              echo ""
              echo "**Skipped tests are not passes:**"
              echo ""
              echo '```'
              echo "$skipped"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: pnpm run build

  # T11.7 (D17 ②): the generated winget manifest must pass winget's own validation. Placeholder hash, so this checks
  # the schema and fields only; the real hashes come from the release's SHA256SUMS.txt (T11.9).
  winget-manifest:
    name: winget manifest (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - name: Validate the generated winget manifest
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          node scripts/distribution-manifests.cjs --version $v --placeholder --out distribution-out
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { throw 'winget is not available on this runner image' }
          winget --version
          winget validate --manifest "distribution-out/winget/manifests/j/junjunup/TokenUsageAssistant/$v" --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed ($LASTEXITCODE)" }
