name: Upstream versions

# T9.1: weekly read-only check of Codex CLI, Claude Code and DeepSeek Harness against the versions this app has
# verified. Writes a report to the job summary only: no issues, no commits, no package installs.
on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - name: Check upstream versions
        run: node scripts/check-upstream.cjs
