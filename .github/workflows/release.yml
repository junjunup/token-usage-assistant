name: Release

# Builds all four installers, runs the packaged native smoke test on each platform and records
# integrity reports. A v* tag also creates a draft prerelease in this (private) repository.
# Publishing to the public installer repository (D8) is a separate, manually triggered step
# that is not part of this workflow yet.
on:
  push:
    tags: ['v*']
    branches: ['task/T2.4-upgrade-verifier'] # TEMPORARY: verify before merge; reverted before merging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to find the previous version for the upgrade check
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # electron is not in allowBuilds, so fetch its checksum-verified binary explicitly.
      - name: Download Electron runtime
        run: node node_modules/electron/install.js
      - run: pnpm run build
      # --publish never: electron-builder would otherwise try to upload to GitHub on its own in CI.
      - name: Package (NSIS + portable)
        run: pnpm exec electron-builder --win --x64 --publish never --config.electronDist=node_modules/electron/dist --config.directories.output=release-out
      - name: Native smoke test (portable EXE, isolated directory)
        run: |
          V=$(node -p "require('./package.json').version")
          node scripts/run-packaged-smoke.cjs --exe "release-out/TokenUsageAssistant-Portable-$V.exe" --report release-out/smoke-result-windows.json
      - name: Package integrity
        run: node scripts/verify-package.cjs --out release-out --report release-out/package-integrity.json
      # Upgrade check with real DPAPI: the previous v* tag is rebuilt from source (app.asar only, no installer)
      # and upgraded to this build in an isolated directory. The old package is a source rebuild of the tag,
      # not a downloaded release binary. The profile is chosen from the two versions (scripts/upgrade-profiles).
      - name: Build previous version from its tag
        run: |
          git -c versionsort.suffix=- tag --merged HEAD --list 'v*' --sort=-v:refname > tags.txt
          git tag --points-at HEAD > head-tags.txt
          PREV=$(grep -vxF -f head-tags.txt tags.txt | head -1 || true)
          [ -n "$PREV" ] || { echo "No previous v* tag found"; exit 1; }
          echo "Previous version tag: $PREV"
          echo "PREV_TAG=$PREV" >> "$GITHUB_ENV"
          ROOT=$(pwd -W)
          git worktree add ../prev-src "$PREV"
          cd ../prev-src
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec electron-builder --win --x64 --dir --publish never --config.electronDist="$ROOT/node_modules/electron/dist" --config.directories.output="$ROOT/prev-out"
      - name: Upgrade verification (previous tag -> this build, real DPAPI)
        run: |
          ROOT=$(pwd -W)
          ./node_modules/electron/dist/electron.exe scripts/verify-upgrade.cjs \
            --old-asar="$ROOT/prev-out/win-unpacked/resources/app.asar" \
            --new-asar="$ROOT/release-out/win-unpacked/resources/app.asar" \
            --test-directory="$ROOT/work/upgrade-ci"
      - name: Keep upgrade report
        if: always()
        run: |
          [ -f work/upgrade-ci/upgrade-native-report.json ] || exit 0
          node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("work/upgrade-ci/upgrade-native-report.json"));r.oldPackageSource="source rebuild of tag "+process.env.PREV_TAG+" (not a downloaded release binary)";fs.writeFileSync("release-out/upgrade-native-report.json",JSON.stringify(r,null,2)+"\n")'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows
          if-no-files-found: error
          path: |
            release-out/TokenUsageAssistant-Setup-*.exe
            release-out/TokenUsageAssistant-Portable-*.exe
            release-out/package-integrity.json
            release-out/smoke-result-windows.json
            release-out/upgrade-native-report.json

  mac:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download Electron runtime
        run: node node_modules/electron/install.js
      - run: pnpm run build
      - name: Package (DMG + ZIP, arm64, ad-hoc)
        run: pnpm run package:mac --publish never --config.directories.output=release-out
      # codesign --verify --deep --strict, packaged native smoke, Info.plist, entitlements.
      # spctl is recorded (expected rejected without notarization) and is never a gate.
      - name: Verify Mac app
        env:
          TUA_RELEASE_DIR: release-out
          TUA_REPORT_DIR: release-out
        run: bash scripts/Verify-Mac-Native.command
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac
          if-no-files-found: error
          path: |
            release-out/TokenUsageAssistant-Mac-arm64-*.dmg
            release-out/TokenUsageAssistant-Mac-arm64-*.zip
            release-out/mac-app-integrity.json

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Check versions are consistent
        run: |
          V=$(node -p "require('./package.json').version")
          node -e '
            const fs = require("fs"), v = process.argv[1], a = "artifacts/";
            const pkg = JSON.parse(fs.readFileSync(a + "package-integrity.json"));
            const win = JSON.parse(fs.readFileSync(a + "smoke-result-windows.json"));
            const mac = JSON.parse(fs.readFileSync(a + "mac-app-integrity.json"));
            const upgrade = JSON.parse(fs.readFileSync(a + "upgrade-native-report.json"));
            console.log(JSON.stringify({ upgrade: upgrade.status, profile: upgrade.profile, from: upgrade.fromVersion, to: upgrade.toVersion }));
            if (upgrade.status !== "passed" || upgrade.toVersion !== v) process.exit(1);
            const seen = { packageIntegrity: pkg.version, windowsSmoke: win.version, macReport: mac.version, macSmoke: mac.smokeEvidence && mac.smokeEvidence.version };
            console.log(JSON.stringify({ expected: v, ...seen }));
            if (!pkg.ok || !win.ok || !mac.ok || Object.values(seen).some((x) => x !== v)) process.exit(1);
          ' "$V"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$V" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $V"; exit 1
          fi
          ls -l artifacts
      - name: Create draft prerelease (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --draft --prerelease \
            --title "Token 用量助手 $GITHUB_REF_NAME" \
            --notes "CI build. Evidence level ②: packaged native smoke in isolated directories on GitHub runners; not real-account or real-device acceptance. Mac build is ad-hoc signed and not notarized."
