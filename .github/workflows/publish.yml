name: Publish

# Manually publishes an already-built release to the public installer repository (D8).
# It reuses the exact installers attached to the source repository's release for the tag (no rebuild) and
# uploads only the four installers plus SHA256SUMS.txt: no source, no integrity JSON (they hold
# runner paths), no smoke reports. The source release must be published (not a draft); since the source repository
# went public (2026-10-18) that release is public too, so the review gate is the dry_run (default), which prepares
# and lists everything without publishing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v1.8.0-beta.6'
        required: true
      dry_run:
        description: 'Only prepare and list files; do not publish'
        type: boolean
        default: true

permissions:
  contents: read

env:
  PUBLIC_REPO: junjunup/TokenUsageAssistant

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid tag: $TAG"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # T8.10: the tagged CHANGELOG.md provides this version's notes (the run fails if it has no section).
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: source

      - name: Download installers from the source release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir public
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D public \
            -p "TokenUsageAssistant-Setup-$VERSION.exe" \
            -p "TokenUsageAssistant-Portable-$VERSION.exe" \
            -p "TokenUsageAssistant-Mac-arm64-$VERSION.dmg" \
            -p "TokenUsageAssistant-Mac-arm64-$VERSION.zip"
          [ "$(ls public | wc -l)" -eq 4 ] || { echo "Expected exactly 4 installers"; ls -l public; exit 1; }

      - name: Checksums and notes
        run: |
          (cd public && sha256sum TokenUsageAssistant-* > SHA256SUMS.txt)
          cat > notes.md <<NOTES
          Token 用量助手 $VERSION（测试版）

          - Windows x64：Setup（安装版）或 Portable（免安装版），未签名；如提示「Windows 已保护你的电脑」，点「更多信息 → 仍要运行」。
          - macOS Apple Silicon（13+）：DMG 或 ZIP。ad-hoc 签名、未公证：首次打开会提示「无法验证开发者」，弹窗里没有「打开」按钮；请关掉提示，到「系统设置 → 隐私与安全性」点「仍要打开」（每个版本一次）。
          - 升级（macOS）：替换后再放行一次；钥匙串授权时输入登录密码并点「始终允许」。
          - 校验：SHA256SUMS.txt。完整说明与常见问题：https://github.com/junjunup/token-usage-assistant/blob/main/docs/INSTALL.md
          - 证据等级：CI 打包原生 smoke（隔离样例）；不代表真实账户或真机验收。

          ## 本版改动

          NOTES
          node source/scripts/changelog-section.cjs "$VERSION" >> notes.md
          {
            echo "### Files to publish to $PUBLIC_REPO ($VERSION)"
            echo '```'
            ls -l public
            cat public/SHA256SUMS.txt
            echo '```'
            echo "### Release notes"
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the public installer repository
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "PUBLIC_RELEASE_TOKEN secret is not set"; exit 1; }
          PRE=""; [[ "$VERSION" == *-* ]] && PRE="--prerelease"
          gh release create "$TAG" public/* -R "$PUBLIC_REPO" $PRE \
            --title "Token 用量助手 $VERSION" --notes-file notes.md
