name: 新平台请求 / New platform request
description: 希望支持某个平台的额度或余额 / Ask for a platform's quota or balance to be supported
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        本应用只使用平台**官方、只读**的用量 / 余额 / 套餐额度接口：不调用模型、不消耗额度、不修改账户。没有这样的接口就无法支持。
        The app only uses **official, read-only** usage / balance / plan quota endpoints: no model calls, no quota spent, no account changes. Without such an endpoint a platform cannot be supported.
  - type: input
    id: platform
    attributes:
      label: 平台名称与网址 / Platform and website
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: 官方只读接口的文档链接 / Link to the official read-only endpoint's documentation
      description: 查询用量、余额或套餐额度的接口说明 / The endpoint that returns usage, balance or plan quota
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 你知道的细节 / What you know
      description: 鉴权方式（API Key / AK·SK / 登录态）、调用是否计费或消耗额度、国内 / 国际区域差异 / Auth method, whether calls are billed or spend quota, region differences
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认 / Confirm
      options:
        - label: 我没有贴出密钥、令牌或账户信息 / I have not included keys, tokens or account details
          required: true
