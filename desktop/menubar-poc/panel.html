<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'"
    />
    <title>Menu-bar POC panel</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="pop" id="pop">
      <header class="head">
        <span class="acct"><i class="dot"></i>Command Code <small>示例账户</small></span>
        <span class="muted">2 分钟前更新</span>
      </header>
      <section class="sec">
        <div class="q">
          <div class="meta"><span class="muted">5 小时窗口</span><b>62%</b></div>
          <div class="segments" data-value="62"></div>
          <div class="muted reset">2 小时 14 分后重置</div>
        </div>
        <div class="q">
          <div class="meta"><span class="muted">每周额度</span><b>78%</b></div>
          <div class="segments" data-value="78"></div>
          <div class="muted reset">周一 09:00 重置</div>
        </div>
      </section>
      <section class="sec cells">
        <div><small>今日 Token</small><b class="token">1.24M</b><em>账户接口</em></div>
        <div><small>今日费用</small><b>$3.18</b><em>平台返回</em></div>
        <div><small>余额</small><b>—</b><em>无余额接口</em></div>
      </section>
      <section class="sec chips">
        <button class="chip sel"><i class="dot"></i>Command Code</button>
        <button class="chip"><i class="dot amber"></i>GLM <span class="mono">15%</span></button>
        <button class="chip"><i class="dot"></i>DeepSeek <span class="mono">¥86.40</span></button>
      </section>
      <footer class="foot">
        <button class="link">官方用量页 ›</button><span class="tag">POC 示例数据</span
        ><button class="link">主窗口 ›</button>
      </footer>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
