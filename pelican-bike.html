<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelican Riding a Bicycle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #F0F8FF 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
        }
        svg {
            max-width: 100%;
            max-height: 100vh;
        }
    </style>
</head>
<body>
    <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Pelican riding a bicycle animation">
        <!-- Ground -->
        <line x1="0" y1="380" x2="800" y2="380" stroke="#228B22" stroke-width="4" />
        
        <!-- Bicycle Group (animated) -->
        <g>
            <!-- Wheels -->
            <g>
                <!-- Back wheel -->
                <circle cx="200" cy="350" r="45" fill="none" stroke="#333" stroke-width="8" />
                <circle cx="200" cy="350" r="5" fill="#333" />
                <!-- Back wheel spokes -->
                <g stroke="#666" stroke-width="3" opacity="0.7">
                    <line x1="200" y1="305" x2="200" y2="395">
                        <animateTransform attributeName="transform" type="rotate" 
                            from="0 200 350" to="360 200 350" dur="1s" repeatCount="indefinite" />
                    </line>
                    <line x1="155" y1="350" x2="245" y2="350">
                        <animateTransform attributeName="transform" type="rotate" 
                            from="0 200 350" to="360 200 350" dur="1s" repeatCount="indefinite" />
                    </line>
                    <line x1="168" y1="318" x2="232" y2="382">
                        <animateTransform attributeName="transform" type="rotate" 
                            from="0 200 350" to="360 200 350" dur="1s" repeatCount="indefinite" />
                    </line>
                    <line x1="168" y1="382" x2="232" y2="318">
                        <animateTransform attributeName="transform" type="rotate" 
                            from="0 200 350" to="360 200 350" dur="1s" repeatCount="indefinite" />
                    </line>
                </g>
                
                <!-- Front wheel -->
                <circle cx="320" cy="350" r="45" fill="none" stroke="#333" stroke-width="8" />
                <circle cx="320" cy="350" r="5" fill="#333" />
                <!-- Front wheel spokes -->
                <g stroke="#666" stroke-width="3" opacity="0.7">
                    <line x1="320" y1="305" x2="320" y2="395">
                        <animateTransform attributeName="transform" type="rotate" 
                            from="0 320 350" to="360 320 350" dur="1s" repeatCount="indefinite" />
                    </line>
                    <line x1="275" y1="350" x2="365" y2="350">
                        <animateTransform attributeName="transform" type="rotate" 
                            from="0 320 350" to="360 320 350" dur="1s" repeatCount="indefinite" />
                    </line>
                    <line x1="288" y1="318" x2="352" y2="382">
                        <animateTransform attributeName="transform" type="rotate" 
                            from="0 320 350" to="360 320 350" dur="1s" repeatCount="indefinite" />
                    </line>
                    <line x1="288" y1="382" x2="352" y2="318">
                        <animateTransform attributeName="transform" type="rotate" 
                            from="0 320 350" to="360 320 350" dur="1s" repeatCount="indefinite" />
                    </line>
                </g>
            </g>
            
            <!-- Bicycle frame -->
            <g stroke="#4169E1" stroke-width="8" fill="none" stroke-linecap="round">
                <!-- Main triangle -->
                <line x1="200" y1="350" x2="260" y2="300" />
                <line x1="260" y1="300" x2="320" y2="350" />
                <line x1="260" y1="300" x2="245" y2="260" />
                <!-- Seat tube -->
                <line x1="260" y1="300" x2="270" y2="350" />
                <!-- Seat -->
                <ellipse cx="270" cy="350" rx="12" ry="6" fill="#8B4513" stroke="#654321" stroke-width="2" />
                <!-- Handlebars -->
                <line x1="245" y1="260" x2="225" y2="245" />
                <line x1="245" y1="260" x2="265" y2="245" />
                <path d="M 220 245 Q 245 235 270 245" stroke="#333" stroke-width="4" fill="none" />
                <!-- Pedal/crank -->
                <line x1="260" y1="300" x2="240" y2="320" />
                <circle cx="240" cy="320" r="10" fill="none" stroke="#333" stroke-width="4" />
                <circle cx="240" cy="320" r="3" fill="#333" />
                <line x1="240" y1="320" x2="235" y2="335" />
                <line x1="240" y1="320" x2="245" y2="305" />
            </g>
        </g>
        
        <!-- Pelican Group (animated with bike) -->
        <g>
            <animateTransform attributeName="transform" type="translate" 
                from="0 0" to="400 0" dur="4s" repeatCount="indefinite" 
                calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1" />
            <animateTransform attributeName="transform" type="translate" additive="sum"
                values="0 0; 0 -8; 0 0; 0 -6; 0 0" dur="1s" repeatCount="indefinite" />
            
            <!-- Pelican body -->
            <g>
                <!-- Body -->
                <ellipse cx="250" cy="200" rx="35" ry="28" fill="#FFFFFF" stroke="#708090" stroke-width="2" />
                <!-- Breast -->
                <ellipse cx="230" cy="210" rx="18" ry="16" fill="#F5F5F5" stroke="#708090" stroke-width="1.5" />
                <!-- Neck -->
                <path d="M 215 195 Q 200 170 210 150" stroke="#FFFFFF" stroke-width="20" fill="none" 
                    stroke-linecap="round" />
                <path d="M 215 195 Q 200 170 210 150" stroke="#708090" stroke-width="21" fill="none" 
                    opacity="0.3" stroke-linecap="round" />
            </g>
            
            <!-- Pelican head -->
            <g>
                <animateTransform attributeName="transform" type="rotate" 
                    values="0 210 150; -8 210 150; 0 210 150; -5 210 150; 0 210 150" 
                    dur="1s" repeatCount="indefinite" additive="sum" />
                <!-- Head -->
                <circle cx="210" cy="150" r="14" fill="#FFFFFF" stroke="#708090" stroke-width="2" />
                <!-- Eye -->
                <circle cx="207" cy="148" r="3" fill="#000000" />
                <circle cx="206.5" cy="147.5" r="1" fill="#FFFFFF" />
                <!-- Beak (large pelican bill) -->
                <path d="M 210 150 L 180 155 L 210 160 Q 195 155 210 150" fill="#F4A460" stroke="#D2691E" stroke-width="2" />
                <path d="M 180 155 L 175 157 L 180 159 Z" fill="#8B4513" />
                <!-- Throat pouch -->
                <path d="M 190 158 Q 185 165 195 175 Q 205 185 215 175" fill="#DEB887" 
                    opacity="0.8" stroke="#D2691E" stroke-width="1" opacity="0.6">
                    <animate attributeName="d" 
                        values="M 190 158 Q 185 165 195 175 Q 205 185 215 175; M 190 158 Q 182 168 195 178 Q 205 188 215 175; M 190 158 Q 185 165 195 175 Q 205 185 215 175" 
                        dur="0.5s" repeatCount="indefinite" />
                    <animate attributeName="opacity" values="0.5; 0.7; 0.5" dur="0.5s" repeatCount="indefinite" />
                </path>
            </g>
            
            <!-- Wings -->
            <g>
                <!-- Left wing (folded while riding) -->
                <path d="M 245 200 Q 280 180 275 220 Q 260 210 245 200" 
                    fill="#FFFFFF" stroke="#708090" stroke-width="2" opacity="0.9">
                    <animateTransform attributeName="transform" type="rotate" 
                        values="0 245 200; -5 245 200; 0 245 200" 
                        dur="0.8s" repeatCount="indefinite" additive="sum" />
                </path>
                <!-- Right wing (folded while riding) -->
                <path d="M 235 195 Q 270 175 265 215 Q 250 205 235 195" 
                    fill="#F5F5F5" stroke="#708090" stroke-width="2" opacity="0.85">
                    <animateTransform attributeName="transform" type="rotate" 
                        values="0 235 195; -3 235 195; 0 235 195" 
                        dur="0.8s" repeatCount="indefinite" additive="sum" />
                </path>
            </g>
            
            <!-- Pelican tail -->
            <path d="M 285 200 Q 295 195 300 205 Q 295 210 285 210" 
                fill="#FFFFFF" stroke="#708090" stroke-width="2" />
            
            <!-- Legs and feet on pedals -->
            <g>
                <!-- Left leg -->
                <line x1="245" y1="225" x2="238" y2="280" stroke="#F4A460" stroke-width="12" stroke-linecap="round" />
                <line x1="238" y1="280" x2="235" y2="330" stroke="#F4A460" stroke-width="12" stroke-linecap="round" />
                <circle cx="235" cy="330" r="6" fill="#000000" />
                
                <!-- Right leg (on pedal) -->
                <line x1="245" y1="225" x2="242" y2="280" stroke="#F4A460" stroke-width="12" stroke-linecap="round" />
                <line x1="242" y1="280" x2="243" y2="325" stroke="#F4A460" stroke-width="12" stroke-linecap="round">
                    <animateTransform attributeName="transform" type="rotate" 
                        values="0 242 280; 15 242 280; 0 242 280; -10 242 280; 0 242 280" 
                        dur="1s" repeatCount="indefinite" additive="sum" />
                </line>
                <circle cx="243" cy="325" r="6" fill="#000000">
                    <animateTransform attributeName="transform" type="rotate" 
                        values="0 242 280; 15 242 280; 0 242 280; -10 242 280; 0 242 280" 
                        dur="1s" repeatCount="indefinite" additive="sum" origin="242 280" />
                </circle>
            </g>
        </g>
        
        <!-- Scenery (simple clouds) -->
        <g opacity="0.8">
            <ellipse cx="600" cy="80" rx="40" ry="20" fill="#FFFFFF" />
            <ellipse cx="620" cy="75" rx="35" ry="18" fill="#FFFFFF" />
            <ellipse cx="580" cy="75" rx="30" ry="16" fill="#FFFFFF" />
            
            <ellipse cx="400" cy="60" rx="45" ry="22" fill="#FFFFFF" opacity="0.9" />
            <ellipse cx="425" cy="55" rx="38" ry="20" fill="#FFFFFF" opacity="0.9" />
            <ellipse cx="375" cy="55" rx="32" ry="18" fill="#FFFFFF" opacity="0.9" />
            
            <ellipse cx="150" cy="90" rx="38" ry="19" fill="#FFFFFF" opacity="0.9" />
            <ellipse cx="170" cy="85" rx="32" ry="17" fill="#FFFFFF" opacity="0.9" />
            <ellipse cx="130" cy="85" rx="28" ry="15" fill="#FFFFFF" opacity="0.9" />
            
            <!-- Cloud movement -->
            <animateTransform attributeName="transform" type="translate" 
                from="0 0" to="-200 0" dur="15s" repeatCount="indefinite" />
        </g>
    </svg>
</body>
</html>
